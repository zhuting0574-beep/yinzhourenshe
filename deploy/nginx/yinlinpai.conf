# Install as /etc/nginx/conf.d/yinlinpai.conf after placing the certificate at:
#   /etc/nginx/ssl/yinlinpai/www.yinlinpai.com.pem
#   /etc/nginx/ssl/yinlinpai/www.yinlinpai.com.key
# The backend and admin dist are expected at 127.0.0.1:8081 and /opt/yinzhou/admin-dist.

server {
    listen 80;
    listen [::]:80;
    server_name yinlinpai.com www.yinlinpai.com;
    return 301 https://www.yinlinpai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yinlinpai.com;
    ssl_certificate     /etc/nginx/ssl/yinlinpai/www.yinlinpai.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yinlinpai/www.yinlinpai.com.key;
    return 301 https://www.yinlinpai.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yinlinpai.com;

    ssl_certificate     /etc/nginx/ssl/yinlinpai/www.yinlinpai.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yinlinpai/www.yinlinpai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:yinlinpai_tls:10m;
    ssl_session_timeout 1d;

    root /opt/yinzhou/admin-dist;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8081/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
